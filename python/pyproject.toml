[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-python"
version = "0.1.1"
description = "Python side of folio: the folio_hook helper for plot hooks and the folio_client HTTP client"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[tool.setuptools]
packages = ["folio_hook", "folio_client"]
