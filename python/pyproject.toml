[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-deck"
version = "0.1.4"
description = "folio: an agent-first slide deck framework. Installs the folio CLI, folio_hook (plot hooks) and folio_client (the HTTP client)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["playwright>=1.62"]

[project.urls]
Homepage = "https://github.com/pakaLFZ/folio"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
plots = ["matplotlib>=3.8"]

[project.scripts]
folio = "folio_deck.cli:main"

[tool.setuptools]
packages = ["folio_hook", "folio_client", "folio_deck"]

[tool.setuptools.package-data]
folio_deck = ["_dist/**/*"]
