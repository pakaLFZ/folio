# folio on Linux, macOS and Windows (spec/process/platforms.md). Runs on pull requests and by hand only:
# macOS runner minutes are billed at 10x on a private repository, so never on every push.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: matplotlib
        run: python -m pip install matplotlib

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm -s typecheck

      - name: unit tests
        run: pnpm -s test

      - name: web build
        run: pnpm -s build:web

      - name: Chromium (Linux, with the libraries it needs)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Chromium
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium

      - name: folio doctor
        run: node packages/cli/bin/folio.mjs doctor

      - name: e2e checks
        if: runner.os != 'Windows'
        shell: bash
        env:
          FOLIO_E2E_JOBS: "2"
        run: bash e2e/run-all.sh

      - name: e2e logs
        if: failure() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.os }}
          path: scratch/e2e/logs-*
          if-no-files-found: ignore
